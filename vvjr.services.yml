services:
  Drupal\vvjr\Hook\VvjrHelpHook:
    autowire: true

  Drupal\vvjr\Hook\VvjrThemeHook:
    autowire: true

  Drupal\vvjr\Hook\VvjrPreprocessHooks:
    autowire: true

  # `@?` makes the dependency nullable so the container compiles even
  # when vvj_core hasn't been enabled yet (the v1 → v2 upgrade window
  # before vvjr_update_10001 runs).
  Drupal\vvjr\Hook\VvjrTokenHooks:
    arguments:
      - '@?vvj_core.token_resolver'
